name: Build and Deploy DocIntel AI

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build all services
        run: |
          cd document-service && ./mvnw clean package -DskipTests && cd ..
          cd embedding-service && ./mvnw clean package -DskipTests && cd ..
          cd query-service && ./mvnw clean package -DskipTests && cd ..
          cd audit-service && ./mvnw clean package -DskipTests && cd ..
          cd api-gateway && ./mvnw clean package -DskipTests && cd ..

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/docintel-document:latest ./document-service
          docker push ${{ secrets.DOCKER_USERNAME }}/docintel-document:latest
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/docintel-embedding:latest ./embedding-service
          docker push ${{ secrets.DOCKER_USERNAME }}/docintel-embedding:latest
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/docintel-query:latest ./query-service
          docker push ${{ secrets.DOCKER_USERNAME }}/docintel-query:latest
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/docintel-audit:latest ./audit-service
          docker push ${{ secrets.DOCKER_USERNAME }}/docintel-audit:latest
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/docintel-gateway:latest ./api-gateway
          docker push ${{ secrets.DOCKER_USERNAME }}/docintel-gateway:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/docintel
            docker compose -f docker-compose.yml -f docker-compose.services.yml pull
            docker compose -f docker-compose.yml -f docker-compose.services.yml up -d
            docker image prune -f