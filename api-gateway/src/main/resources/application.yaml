server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: document-service
              uri: ${DOCUMENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/documents/**
            - id: query-service
              uri: ${QUERY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/query/**
            - id: audit-service
              uri: ${AUDIT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/audit/**
            - id: auth-service
              uri: ${DOCUMENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**

jwt:
  secret: docintel-secret-key-must-be-at-least-32-characters-long